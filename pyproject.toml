[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-wake-me-up"
version = "0.1.0"
description = "Host-local durable monitors for guarded Codex goal continuation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "aiohttp>=3.13,<4",
  "mcp>=1,<2",
]

[project.scripts]
codex-wake-me-up = "codex_wake_me_up.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
